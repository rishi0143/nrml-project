name: env

on: push

env:
  TAGS: "3.0"

jobs:
  envjob:
    env:
      APP_ENV: "dev"

    runs-on: ubuntu-latest

    steps:
      - name: print env
        run: echo "welcome to $APP_ENV version $TAGS"

  newjob:
    env:
      APP_ENV: "uat"

    runs-on: ubuntu-latest

    steps:
      - name: print env
        run: echo "welcome to $APP_ENV version $TAGS"